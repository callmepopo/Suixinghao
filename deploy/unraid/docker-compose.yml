# Alternative to DockerMan. Do not run both methods for the same module.
services:
  hideck:
    image: yibaiba/hideck:2.1.23
    container_name: hideck
    network_mode: host
    privileged: true
    init: true
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config/config.yaml
      TZ: Asia/Shanghai
    volumes:
      - ${HIDECK_DATA_DIR:-/mnt/user/appdata/hideck}/config:/app/config
      - ${HIDECK_DATA_DIR:-/mnt/user/appdata/hideck}/data:/app/data
      - ${HIDECK_DATA_DIR:-/mnt/user/appdata/hideck}/logs:/app/logs
      - /dev:/dev
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [CMD-SHELL, "wget -q -T 3 -O /dev/null http://127.0.0.1:7577/ping || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
