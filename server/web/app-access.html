<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>随行号 · App 接入</title>
<style>body{font:16px -apple-system,BlinkMacSystemFont,sans-serif;max-width:640px;margin:40px auto;padding:20px;background:#f4f7f8;color:#162c34}section{background:white;padding:24px;border-radius:20px;margin:20px 0}input,button{font:inherit;padding:12px;border:1px solid #cedbdc;border-radius:10px;box-sizing:border-box}input{display:block;width:100%;margin:12px 0}button{background:#087e83;color:white;cursor:pointer}p{line-height:1.6}small{color:#52676d}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#edf5f5;padding:16px;border-radius:12px}li{margin:16px 0;display:flex;gap:12px;align-items:center;justify-content:space-between}#notice{white-space:pre-wrap}</style>
<h1>随行号 App 接入</h1><p>一套模块服务，网页与 App 共用。每台手机使用独立 Key，可随时撤销。</p>
<section id="login"><h2>管理员验证</h2><form id="loginForm"><input id="username" autocomplete="username" placeholder="HiDeck 网页用户名" required><input id="password" autocomplete="current-password" type="password" placeholder="网页密码" required><button>登录</button></form></section>
<section id="manage" hidden><h2>连接信息</h2><small>将下面的服务地址填入 App 设置</small><pre id="address"></pre><form id="createForm"><input id="label" placeholder="Key 名称，例如：我的 iPhone" maxlength="40" required><button>创建 App Key</button></form><div id="secretBox" hidden><p>Key 只展示这一次，请直接填入 App。不要把 Key 放进分享的安装包。</p><pre id="secret"></pre><button id="hideSecret">已保存，隐藏 Key</button></div><h2>已授权设备</h2><ul id="keys"></ul><button id="logout">退出管理</button></section><p id="notice" role="status"></p><p><a href="../">返回网页电话台</a></p>
<script>
'use strict';
const $=id=>document.getElementById(id);let token='';let busy=false;
async function request(path,method='GET',body){const headers={'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const r=await fetch('../'+path,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store',credentials:'omit',redirect:'error'});if(!r.ok)throw Error(r.status===401?'验证失效，请重新登录。':'操作失败（HTTP '+r.status+'）');return r.status===204?null:r.json()}
async function run(action){if(busy)return;busy=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);$('notice').textContent='';try{await action()}catch(e){$('notice').textContent=e.message}finally{busy=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function list(){const keys=await request('app-keys');$('keys').replaceChildren();for(const key of keys){const li=document.createElement('li');const name=document.createElement('span');name.textContent=key.name+' · '+new Date(key.created_at).toLocaleDateString();const b=document.createElement('button');b.textContent='撤销';b.onclick=()=>{if(confirm('撤销后，该设备不能再访问服务。继续？'))run(async()=>{await request('app-keys?id='+encodeURIComponent(key.id),'DELETE');$('secret').textContent='';$('secretBox').hidden=true;await list()})};li.append(name,b);$('keys').append(li)}}
$('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{const password=$('password').value;$('password').value='';const data=await request('login','POST',{username:$('username').value,password});token=data.token;$('login').hidden=true;$('manage').hidden=false;$('address').textContent=location.origin;await list()})};
$('createForm').onsubmit=e=>{e.preventDefault();run(async()=>{const data=await request('app-keys','POST',{name:$('label').value});$('secret').textContent=data.key;$('secretBox').hidden=false;$('label').value='';await list()})};
$('hideSecret').onclick=()=>{$('secret').textContent='';$('secretBox').hidden=true};
$('logout').onclick=()=>run(async()=>{try{await request('logout','POST',{})}finally{token='';$('secret').textContent='';$('secretBox').hidden=true;$('keys').replaceChildren();$('manage').hidden=true;$('login').hidden=false}});
</script></html>
